<app-association-navbar></app-association-navbar>

<section class="create-shell">
  <header class="create-header">
    <div>
      <p class="kicker">Nouvelle campagne</p>
      <h1>Creer une campagne</h1>
      <p>Partagez clairement l'objectif et l'impact attendu.</p>
    </div>
  </header>

  <form [formGroup]="form" class="create-form">
    @if (parentRequest()) {
      <section class="derived-panel">
        <div>
          <p class="derived-kicker">Campagne derivee</p>
          <h2>{{ parentRequest()?.title }}</h2>
          <p>{{ parentRequest()?.description }}</p>
          <a class="link" [routerLink]="['/request-detail', parentRequestId()]">Voir la demande</a>
        </div>
        <div class="derived-image" [style.background-image]="derivedImageUrl() ? 'url(' + derivedImageUrl() + ')' : 'linear-gradient(135deg, rgba(14, 165, 233, 0.2), rgba(34, 197, 94, 0.2))'"></div>
      </section>
    }
    <div class="field">
      <label for="title">Titre</label>
      <input id="title" type="text" formControlName="title" placeholder="Aide alimentaire urgente" />
    </div>

    <div class="field">
      <label for="description">Description courte</label>
      <textarea id="description" rows="3" formControlName="description" placeholder="Resume de la campagne"></textarea>
    </div>

    <div class="field">
      <label for="full_description">Description detaillee</label>
      <textarea id="full_description" rows="5" formControlName="full_description" placeholder="Expliquez le contexte et les objectifs"></textarea>
    </div>

    <div class="grid">
      <div class="field">
        <label for="goal_amount">Objectif (TND)</label>
        <input id="goal_amount" type="number" min="1" formControlName="goal_amount" />
      </div>
      <div class="field">
        <label for="category_id">Categorie</label>
        <select id="category_id" formControlName="category_id">
          <option [value]="null">Selectionner</option>
          @for (category of categories(); track category.id) {
            <option [value]="category.id">{{ category.name }}</option>
          }
        </select>
      </div>
    </div>

    <div class="grid">
      <div class="field">
        <label for="location">Localisation</label>
        <input id="location" type="text" formControlName="location" placeholder="Tunis" />
      </div>
      <div class="field">
        <label for="urgency">Urgence</label>
        <select id="urgency" formControlName="urgency">
          <option value="low">Basse</option>
          <option value="medium">Moyenne</option>
          <option value="high">Haute</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label for="image">Image de la campagne</label>
      <input id="image" type="file" (change)="onFileSelected($event)" />
    </div>

    @if (error()) {
      <div class="state state--error">{{ error() }}</div>
    }

    <div class="actions">
      <button type="button" class="primary" (click)="submit()" [disabled]="submitting()">Publier</button>
      <a class="ghost" routerLink="/association/campaigns">Annuler</a>
    </div>
  </form>
</section>
