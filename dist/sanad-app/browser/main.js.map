<div class="auth-page">
  <section class="auth-visual">
    <div class="brand">
      <div class="logo-placeholder" aria-label="Logo Sanad">S</div>
      <span class="brand-name">Sanad</span>
    </div>
    <h1>Nous sommes la pour vous accompagner</h1>
    <p>
      Si des informations changent, vous pouvez soumettre une nouvelle demande.
    </p>
  </section>

  <section class="auth-body">
    <div class="status-card">
      <strong>Votre demande n'a pas ete approuvee.</strong>
      <p>Vous pouvez soumettre une nouvelle demande.</p>
      <a class="link" routerLink="/auth/register">Soumettre une nouvelle demande</a>
    </div>
  </section>
</div>
