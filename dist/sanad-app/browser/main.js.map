<app-logged-in-navbar></app-logged-in-navbar>

<main class="publish">
  <header class="header">
    <h1>Publier une demande</h1>
    <p>Deposez une demande claire et transparente.</p>
  </header>

  <form class="publish-form">
    <label>Titre de la demande</label>
    <input [(ngModel)]="model.title" name="title" placeholder="Aide alimentaire" />

    <div class="grid">
      <div>
        <label>Categorie</label>
        <input [(ngModel)]="model.category" name="category" placeholder="Sante, Education" />
      </div>
      <div>
        <label>Urgence</label>
        <select [(ngModel)]="model.urgency" name="urgency">
          <option value="high">Elevee</option>
          <option value="medium">Moyenne</option>
          <option value="low">Basse</option>
        </select>
      </div>
    </div>

    <div class="grid">
      <div>
        <label>Localisation</label>
        <input [(ngModel)]="model.location" name="location" placeholder="Tunis" />
      </div>
      <div>
        <label>Montant souhaite</label>
        <input [(ngModel)]="model.amount" name="amount" placeholder="25000" />
      </div>
    </div>

    <label>Description</label>
    <textarea rows="4" placeholder="Expliquez l\'impact attendu."></textarea>

    <button class="primary" type="button">Publier</button>
  </form>
</main>
