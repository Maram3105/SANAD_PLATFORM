<div class="auth-page">
  <section class="auth-visual">
    <div class="brand">
      <div class="logo-placeholder" aria-label="Logo Sanad">S</div>
      <span class="brand-name">Sanad</span>
    </div>
    <h1>La transparence cree la confiance</h1>
    <p>
      Votre profil d'association est en cours de verification pour proteger la
      communaute.
    </p>
  </section>

  <section class="auth-body">
    <div class="status-card">
      <strong>Votre compte association est en cours de verification.</strong>
      <p>Cette etape garantit la transparence et la confiance.</p>
      <a class="link" routerLink="/auth/login">Retour a la connexion</a>
    </div>
  </section>
</div>
